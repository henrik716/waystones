services:
  oapif:
    image: ghcr.io/waystones-nexus/oapif-go:27ac4e67094bd694d902c0df8e8a813c4ed65a71
    ports:
      - "5000:5000"
    environment:
      SERVER_URL: http://localhost:5000
      IS_PRIVATE: "0"
    volumes:
      - ./config.json:/config.json:ro
    # S3 credentials — required. Set via .env or environment:
    # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET, S3_ENDPOINT
    env_file:
      - path: .env
        required: false

  qgis:
    image: ghcr.io/waystones-nexus/waystones-keystone:qgis-latest
    ports:
      - "8080:80"
    environment:
      WAYSTONES_MODE: open-source
    profiles:
      - wms  # only started with: docker compose --profile wms up
