name: Tests

on:
  push:
    branches: [main, unstable, dev]
  pull_request:
    branches: [main, unstable]

jobs:
  test-python:
    name: Python worker unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/worker/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r docker/worker/requirements-test.txt

      - name: Run pytest
        run: cd docker/worker && python -m pytest tests/ -v --tb=short

  test-typescript:
    name: TypeScript utility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test
